# Fixed project name, so Jenkins and manual runs manage the same containers
name: calculator-devops

services:

  # Our Spring Boot calculator app
  calculator:
    image: kodercrish/calculator:${IMAGE_TAG:-latest}
    container_name: calculator
    environment:
      - SERVER_PORT=8080
      - SPRING_APPLICATION_NAME=calculator
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - calc-net

  # Nginx reverse proxy in front of the calculator
  nginx:
    image: nginx:1.27-alpine
    container_name: calculator-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - calc-net

networks:
  calc-net:
